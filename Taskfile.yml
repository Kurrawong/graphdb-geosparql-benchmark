version: "3"

vars:
  DATA_DIR: downloads
  DATA_FILE: mdv.osm.ttl
  DATA_ARCHIVE: mdv.osm.ttl.bz2
  DATA_URL: https://osm2rdf.cs.uni-freiburg.de/ttl/mdv.osm.ttl.bz2
  REPOSITORY_ID: maldives
  GRAPHDB_URL: http://localhost:7200
  V1_SPATIAL_INDEX_DIR: graphdb-home-geosparql-v1/data/repositories/maldives/storage/GeoSPARQL
  V2_SPATIAL_INDEX_DIR: graphdb-home-geosparql-v2/data/repositories/maldives/storage/GeoSPARQL
  V2_REPOSITORY: https://github.com/Kurrawong/graphdb-geosparql-plugin.git

tasks:
  download-data:
    desc: Download and unpack the Maldives OSM dataset
    status:
      - test -f "{{.DATA_DIR}}/{{.DATA_FILE}}"
    cmds:
      - mkdir -p "{{.DATA_DIR}}"
      - >-
        curl --fail --location --retry 3
        --output "{{.DATA_DIR}}/{{.DATA_ARCHIVE}}.part"
        "{{.DATA_URL}}"
      - mv "{{.DATA_DIR}}/{{.DATA_ARCHIVE}}.part" "{{.DATA_DIR}}/{{.DATA_ARCHIVE}}"
      - bzip2 --decompress --keep --force "{{.DATA_DIR}}/{{.DATA_ARCHIVE}}"

  v1:up:
    desc: Start and initialise GraphDB with the bundled GeoSPARQL v1 plugin
    deps:
      - download-data
    cmds:
      - docker compose --profile v2 down graphdb-geosparql-v2
      - docker compose --profile v1 up --detach graphdb-geosparql-v1
      - task: initialise
        vars:
          GRAPHDB_URL: "{{.GRAPHDB_URL}}"
      - task: remove-geometry-collection-wkts
        vars:
          GRAPHDB_URL: "{{.GRAPHDB_URL}}"
      - task: allow-spatial-index-errors
        vars:
          GRAPHDB_URL: "{{.GRAPHDB_URL}}"
      - task: enable-spatial-index
        vars:
          GRAPHDB_URL: "{{.GRAPHDB_URL}}"
          SPATIAL_INDEX_DIR: "{{.V1_SPATIAL_INDEX_DIR}}"

  v1:down:
    desc: Stop the GeoSPARQL v1 GraphDB container
    cmds:
      - docker compose --profile v1 down graphdb-geosparql-v1

  v1:down-clean:
    desc: Delete the v1 repository through the REST API and stop GraphDB
    cmds:
      - task: delete-repository
        vars:
          COMPOSE_PROFILE: v1
          COMPOSE_SERVICE: graphdb-geosparql-v1
          GRAPHDB_URL: "{{.GRAPHDB_URL}}"
      - task: remove-spatial-index-files
        vars:
          SPATIAL_INDEX_DIR: "{{.V1_SPATIAL_INDEX_DIR}}"
      - task: v1:down

  v2:build:
    desc: Build the GeoSPARQL v2 image from master (or GEOSPARQL_V2_REF)
    cmds:
      - task: v2:build-image
        vars:
          BUILD_FLAGS: --pull

  v2:build-no-cache:
    desc: Rebuild the GeoSPARQL v2 image without using the Docker build cache
    cmds:
      - task: v2:build-image
        vars:
          BUILD_FLAGS: --pull --no-cache

  v2:build-image:
    internal: true
    requires:
      vars:
        - BUILD_FLAGS
    cmds:
      - |
        set -eu
        build_started="$(date +%s)"
        plugin_ref="${GEOSPARQL_V2_REF:-master}"
        if [ "$plugin_ref" = "master" ]; then
          plugin_ref="$(git ls-remote "{{.V2_REPOSITORY}}" refs/heads/master | awk '{print $1}')"
          if [ -z "$plugin_ref" ]; then
            echo "Could not resolve the v2 master commit" >&2
            exit 1
          fi
          echo "Building GeoSPARQL v2 commit $plugin_ref"
        fi
        GEOSPARQL_V2_REF="$plugin_ref" \
          docker compose build {{.BUILD_FLAGS}} \
          --build-arg GEOSPARQL_V2_REF="$plugin_ref" \
          graphdb-geosparql-v2
        build_finished="$(date +%s)"
        build_duration="$((build_finished - build_started))"
        echo "GeoSPARQL v2 image build completed successfully in ${build_duration}s"

  v2:up:
    desc: Build, start, and initialise GraphDB with the GeoSPARQL v2 plugin
    deps:
      - download-data
      - v2:build
    cmds:
      - docker compose --profile v1 down graphdb-geosparql-v1
      - docker compose --profile v2 up --detach graphdb-geosparql-v2
      - task: initialise
        vars:
          GRAPHDB_URL: "{{.GRAPHDB_URL}}"
      - task: remove-geometry-collection-wkts
        vars:
          GRAPHDB_URL: "{{.GRAPHDB_URL}}"
      - task: enable-spatial-index
        vars:
          GRAPHDB_URL: "{{.GRAPHDB_URL}}"
          SPATIAL_INDEX_DIR: "{{.V2_SPATIAL_INDEX_DIR}}"

  v2:down:
    desc: Stop the GeoSPARQL v2 GraphDB container
    cmds:
      - docker compose --profile v2 down graphdb-geosparql-v2

  v2:down-clean:
    desc: Delete the v2 repository through the REST API and stop GraphDB
    cmds:
      - task: delete-repository
        vars:
          COMPOSE_PROFILE: v2
          COMPOSE_SERVICE: graphdb-geosparql-v2
          GRAPHDB_URL: "{{.GRAPHDB_URL}}"
      - task: remove-spatial-index-files
        vars:
          SPATIAL_INDEX_DIR: "{{.V2_SPATIAL_INDEX_DIR}}"
      - task: v2:down

  benchmark:all:
    desc: Run fresh v1 and v2 suites in order and generate the final report
    cmds:
      - task: benchmark:v1
      - task: benchmark:v2
      - task: benchmark:report

  benchmark:v1:
    desc: Rebuild and run the complete benchmark suite for GeoSPARQL v1
    cmds:
      - |
        set -eu
        task benchmark:clear VARIANT=v1
        trap 'task v1:down' EXIT
        docker compose --profile v2 down graphdb-geosparql-v2
        task benchmark:reset-variant \
          COMPOSE_PROFILE=v1 \
          COMPOSE_SERVICE=graphdb-geosparql-v1 \
          SPATIAL_INDEX_DIR="{{.V1_SPATIAL_INDEX_DIR}}"
        task v1:up
        task benchmark-query

  benchmark:v2:
    desc: Rebuild and run the complete benchmark suite for GeoSPARQL v2
    cmds:
      - |
        set -eu
        task benchmark:clear VARIANT=v2
        trap 'task v2:down' EXIT
        docker compose --profile v1 down graphdb-geosparql-v1

        plugin_ref="${GEOSPARQL_V2_REF:-master}"
        if [ "$plugin_ref" = "master" ]; then
          plugin_ref="$(git ls-remote "{{.V2_REPOSITORY}}" refs/heads/master | awk '{print $1}')"
          if [ -z "$plugin_ref" ]; then
            echo "Could not resolve the v2 master commit" >&2
            exit 1
          fi
        fi
        echo "Benchmarking GeoSPARQL v2 commit $plugin_ref"

        GEOSPARQL_V2_REF="$plugin_ref" task v2:build
        task benchmark:reset-variant \
          COMPOSE_PROFILE=v2 \
          COMPOSE_SERVICE=graphdb-geosparql-v2 \
          SPATIAL_INDEX_DIR="{{.V2_SPATIAL_INDEX_DIR}}"
        GEOSPARQL_V2_REF="$plugin_ref" task v2:up
        task benchmark-query

  benchmark:report:
    desc: Compare the complete saved v1 and v2 benchmark suites
    cmds:
      - scripts/generate-benchmark-report.sh

  benchmark-query:
    desc: Run the complete query suite against the active GraphDB variant
    cmds:
      - |
        set -eu

        v1_running="$(
          docker compose --profile v1 ps --status running --services |
            grep --count --line-regexp 'graphdb-geosparql-v1' || true
        )"
        v2_running="$(
          docker compose --profile v2 ps --status running --services |
            grep --count --line-regexp 'graphdb-geosparql-v2' || true
        )"

        case "$v1_running:$v2_running" in
          1:0)
            variant="v1"
            plugin_revision="bundled-with-graphdb-11.4.0"
            ;;
          0:1)
            variant="v2"
            plugin_revision="$(
              docker compose --profile v2 exec --no-TTY \
                graphdb-geosparql-v2 \
                cat /opt/graphdb/geosparql-v2-source-commit.txt
            )"
            ;;
          0:0)
            echo "Neither GraphDB benchmark variant is running" >&2
            exit 1
            ;;
          *)
            echo "Expected exactly one GraphDB benchmark variant to be running" >&2
            exit 1
            ;;
        esac

        scripts/run-benchmark-suite.sh \
          "$variant" \
          "{{.GRAPHDB_URL}}" \
          "{{.REPOSITORY_ID}}" \
          "$plugin_revision"

  benchmark:validate:
    desc: Validate benchmark manifests, scripts, Taskfile, and Compose config
    cmds:
      - scripts/validate-query-manifest.sh
      - for script in scripts/*.sh; do sh -n "$script"; done
      - for script in tests/*.sh tests/fixtures/fake-bin/*; do sh -n "$script"; done
      - tests/test-benchmark-scripts.sh
      - docker compose config --quiet

  benchmark:clear:
    requires:
      vars:
        - VARIANT
    cmds:
      - |
        set -eu
        variant="{{.VARIANT}}"
        case "$variant" in
          v1|v2)
            ;;
          *)
            echo "Refusing to clear results for unexpected variant: $variant" >&2
            exit 1
            ;;
        esac

        results_dir="benchmark-results/$variant"
        rm -rf -- "$results_dir"
        echo "Cleared prior GeoSPARQL $variant benchmark results"

  benchmark:reset-variant:
    requires:
      vars:
        - COMPOSE_PROFILE
        - COMPOSE_SERVICE
        - SPATIAL_INDEX_DIR
    cmds:
      - echo "Resetting {{.COMPOSE_SERVICE}} to a clean repository state"
      - >-
        docker compose --profile "{{.COMPOSE_PROFILE}}" up --detach
        "{{.COMPOSE_SERVICE}}"
      - task: delete-repository
        vars:
          COMPOSE_PROFILE: "{{.COMPOSE_PROFILE}}"
          COMPOSE_SERVICE: "{{.COMPOSE_SERVICE}}"
          GRAPHDB_URL: "{{.GRAPHDB_URL}}"
      - task: remove-spatial-index-files
        vars:
          SPATIAL_INDEX_DIR: "{{.SPATIAL_INDEX_DIR}}"
      - >-
        docker compose --profile "{{.COMPOSE_PROFILE}}" down
        "{{.COMPOSE_SERVICE}}"

  remove-geometry-collection-wkts:
    internal: true
    requires:
      vars:
        - GRAPHDB_URL
    cmds:
      - |
        set -eu
        response_file="$(mktemp)"
        trap 'rm -f "$response_file"' EXIT

        curl --fail-with-body --silent --show-error \
          --request POST \
          "{{.GRAPHDB_URL}}/repositories/{{.REPOSITORY_ID}}" \
          --header "Content-Type: application/sparql-query" \
          --header "Accept: application/sparql-results+json" \
          --output "$response_file" \
          --data-binary @- <<'SPARQL'
        PREFIX geo: <http://www.opengis.net/ont/geosparql#>

        SELECT (COUNT(?wkt) AS ?count)
        WHERE {
          ?geometry geo:asWKT ?wkt .
          FILTER(CONTAINS(UCASE(STR(?wkt)), "GEOMETRYCOLLECTION"))
        }
        SPARQL

        geometry_collection_count="$(
          jq --exit-status --raw-output \
            '.results.bindings[0].count.value | tonumber' \
            "$response_file"
        )"

        if [ "$geometry_collection_count" -eq 0 ]; then
          echo "No GeoSPARQL GEOMETRYCOLLECTION WKT literals found"
          exit 0
        fi

        echo "Removing $geometry_collection_count GeoSPARQL GEOMETRYCOLLECTION WKT literals"
        deletion_time="$(
          curl --fail-with-body --silent --show-error \
            --output /dev/null \
            --write-out '%{time_total}' \
            --request POST \
            "{{.GRAPHDB_URL}}/repositories/{{.REPOSITORY_ID}}/statements" \
            --header "Content-Type: application/sparql-update" \
            --data-binary @- <<'SPARQL'
        PREFIX geo: <http://www.opengis.net/ont/geosparql#>

        DELETE {
          ?geometry geo:asWKT ?wkt .
        }
        WHERE {
          ?geometry geo:asWKT ?wkt .
          FILTER(CONTAINS(UCASE(STR(?wkt)), "GEOMETRYCOLLECTION"))
        }
        SPARQL
        )"
        echo "Removed $geometry_collection_count GeoSPARQL GEOMETRYCOLLECTION WKT literals in ${deletion_time}s"

  allow-spatial-index-errors:
    internal: true
    requires:
      vars:
        - GRAPHDB_URL
    cmds:
      - |
        echo "Configuring GeoSPARQL v1 to ignore unsupported geometries"
        configuration_time="$(
          curl --fail-with-body --silent --show-error \
            --output /dev/null \
            --write-out '%{time_total}' \
            --request POST \
            "{{.GRAPHDB_URL}}/repositories/{{.REPOSITORY_ID}}/statements" \
            --header "Content-Type: application/sparql-update" \
            --data-binary @- <<'SPARQL'
        PREFIX geosparql: <http://www.ontotext.com/plugins/geosparql#>

        INSERT DATA {
          [] geosparql:ignoreErrors "true" .
        }
        SPARQL
        )"
        echo "GeoSPARQL v1 error handling configured successfully in ${configuration_time}s"

  enable-spatial-index:
    desc: Enable the GeoSPARQL index on the active GraphDB variant
    requires:
      vars:
        - GRAPHDB_URL
        - SPATIAL_INDEX_DIR
    cmds:
      - |
        set -eu
        echo "Enabling the spatial index"
        indexing_time="$(
          curl --fail-with-body --silent --show-error \
            --output /dev/null \
            --write-out '%{time_total}' \
            --request POST \
            "{{.GRAPHDB_URL}}/repositories/{{.REPOSITORY_ID}}/statements" \
            --header "Content-Type: application/sparql-update" \
            --data-binary @- <<'SPARQL'
        PREFIX geosparql: <http://www.ontotext.com/plugins/geosparql#>

        INSERT DATA {
          [] geosparql:enabled "true" .
        }
        SPARQL
        )"

        index_dir="{{.SPATIAL_INDEX_DIR}}"
        if [ ! -d "$index_dir" ]; then
          echo "GeoSPARQL index directory was not created at $index_dir" >&2
          exit 1
        fi

        index_size="$(du --summarize --human-readable "$index_dir" | cut -f1)"
        index_bytes="$(du --summarize --block-size=1 "$index_dir" | cut -f1)"

        index_configs="$(
          find "$index_dir" -maxdepth 2 -type f -name config.properties \
            -print | LC_ALL=C sort
        )"
        index_config_count="$(
          printf '%s\n' "$index_configs" |
            awk 'NF { count++ } END { print count + 0 }'
        )"
        if [ "$index_config_count" -eq 0 ]; then
          echo "GeoSPARQL index configuration was not found under $index_dir" >&2
          exit 1
        fi
        if [ "$index_config_count" -ne 1 ]; then
          echo "Expected one GeoSPARQL index configuration under $index_dir; found $index_config_count" >&2
          printf '%s\n' "$index_configs" >&2
          exit 1
        fi
        index_config="$index_configs"

        prefix_tree="$(
          awk -F= '$1 == "prefixtree.current" { print $2 }' "$index_config" |
            tr -d '\r'
        )"
        if [ -z "$prefix_tree" ]; then
          prefix_tree="$(
            awk -F= '$1 == "prefixtree" { print $2 }' "$index_config" |
              tr -d '\r'
          )"
        fi
        precision="$(
          awk -F= '$1 == "precision.current" { print $2 }' "$index_config" |
            tr -d '\r'
        )"
        if [ -z "$precision" ]; then
          precision="$(
            awk -F= '$1 == "precision" { print $2 }' "$index_config" |
              tr -d '\r'
          )"
        fi

        if [ -z "$prefix_tree" ]; then
          echo "GeoSPARQL prefix tree is missing from $index_config" >&2
          exit 1
        fi
        case "$precision" in
          ''|*[!0-9]*)
            echo "Invalid GeoSPARQL precision in $index_config: $precision" >&2
            exit 1
            ;;
        esac

        echo "GeoSPARQL spatial indexing completed successfully in ${indexing_time}s"
        echo "GeoSPARQL spatial index size: $index_size ($index_bytes bytes)"
        echo "GeoSPARQL spatial index configuration: $prefix_tree, precision $precision"

        case "$index_dir" in
          "{{.V1_SPATIAL_INDEX_DIR}}")
            variant="v1"
            ;;
          "{{.V2_SPATIAL_INDEX_DIR}}")
            variant="v2"
            ;;
          *)
            echo "Cannot determine benchmark variant from index path: $index_dir" >&2
            exit 1
            ;;
        esac

        index_metrics="benchmark-results/$variant/index-metrics.json"
        index_metrics_part="$index_metrics.part"
        mkdir -p "benchmark-results/$variant"
        trap 'rm -f "$index_metrics_part"' EXIT
        jq --null-input \
          --arg variant "$variant" \
          --arg prefix_tree "$prefix_tree" \
          --argjson precision "$precision" \
          --argjson indexing_time_seconds "$indexing_time" \
          --argjson index_size_bytes "$index_bytes" \
          '{
            schema_version: 2,
            variant: $variant,
            prefix_tree: $prefix_tree,
            precision: $precision,
            indexing_time_seconds: $indexing_time_seconds,
            index_size_bytes: $index_size_bytes
          }' > "$index_metrics_part"
        mv "$index_metrics_part" "$index_metrics"
        echo "Saved spatial index metrics to $index_metrics"

  delete-repository:
    internal: true
    requires:
      vars:
        - COMPOSE_PROFILE
        - COMPOSE_SERVICE
        - GRAPHDB_URL
    cmds:
      - |
        set -eu
        profile="{{.COMPOSE_PROFILE}}"
        service="{{.COMPOSE_SERVICE}}"
        repository_id="{{.REPOSITORY_ID}}"
        repository_url="{{.GRAPHDB_URL}}/rest/repositories/$repository_id"

        if ! docker compose --profile "$profile" ps --status running --services |
          grep --quiet --line-regexp "$service"; then
          echo "$service must be running before its repository can be deleted" >&2
          exit 1
        fi

        echo "Waiting for GraphDB at {{.GRAPHDB_URL}}"
        attempts=0
        until curl --fail --silent --show-error "{{.GRAPHDB_URL}}/rest/repositories" >/dev/null; do
          attempts=$((attempts + 1))
          if [ "$attempts" -ge 120 ]; then
            echo "GraphDB did not become ready within 120 seconds" >&2
            exit 1
          fi
          sleep 1
        done

        repository_status="$(
          curl --silent --output /dev/null --write-out '%{http_code}' "$repository_url"
        )"
        case "$repository_status" in
          200)
            echo "Deleting repository $repository_id through the GraphDB REST API"
            curl --fail-with-body --silent --show-error \
              --request DELETE \
              "$repository_url"
            echo "Repository $repository_id deleted successfully"
            ;;
          404)
            echo "Repository $repository_id does not exist"
            ;;
          *)
            echo "Unexpected repository status: HTTP $repository_status" >&2
            exit 1
            ;;
        esac

  remove-spatial-index-files:
    internal: true
    requires:
      vars:
        - SPATIAL_INDEX_DIR
    cmds:
      - |
        set -eu
        index_dir="{{.SPATIAL_INDEX_DIR}}"

        case "$index_dir" in
          "{{.V1_SPATIAL_INDEX_DIR}}"|"{{.V2_SPATIAL_INDEX_DIR}}")
            ;;
          *)
            echo "Refusing to remove unexpected spatial index path: $index_dir" >&2
            exit 1
            ;;
        esac

        if [ -e "$index_dir" ]; then
          rm -rf -- "$index_dir"
          echo "Removed GeoSPARQL configuration and index files from $index_dir"
        else
          echo "GeoSPARQL index directory does not exist: $index_dir"
        fi

  initialise:
    internal: true
    requires:
      vars:
        - GRAPHDB_URL
    cmds:
      - |
        set -eu
        graphdb_url="{{.GRAPHDB_URL}}"
        repository_id="{{.REPOSITORY_ID}}"
        repository_url="$graphdb_url/rest/repositories/$repository_id"

        echo "Waiting for GraphDB at $graphdb_url"
        attempts=0
        until curl --fail --silent --show-error "$graphdb_url/rest/repositories" >/dev/null; do
          attempts=$((attempts + 1))
          if [ "$attempts" -ge 120 ]; then
            echo "GraphDB did not become ready within 120 seconds" >&2
            exit 1
          fi
          sleep 1
        done

        repository_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$repository_url")"
        case "$repository_status" in
          200)
            echo "Repository $repository_id already exists"
            ;;
          404)
            echo "Creating repository $repository_id"
            curl --fail --show-error \
              --request POST \
              --form "config=@maldives-config.ttl;type=text/turtle" \
              "$graphdb_url/rest/repositories"
            ;;
          *)
            echo "Unexpected repository status: HTTP $repository_status" >&2
            exit 1
            ;;
        esac

        repository_size="$(
          curl --fail --silent --show-error "$repository_url/size" |
            jq --exit-status --raw-output '.total'
        )"
        if [ "$repository_size" = "0" ]; then
          echo "Importing {{.DATA_DIR}}/{{.DATA_FILE}}"
          curl --fail --show-error \
            --request POST \
            --header "Content-Type: text/turtle" \
            --upload-file "{{.DATA_DIR}}/{{.DATA_FILE}}" \
            "$graphdb_url/repositories/$repository_id/statements"
        else
          echo "Repository $repository_id already contains $repository_size statements"
        fi
